name: vibe_up
description: A new Flutter project for Interior design with AR and AI.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_animate: ^4.2.0
  http: ^1.1.0
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.1
  permission_handler: ^11.3.1
  file_picker: ^10.3.10
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  camera: ^0.12.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  webview_flutter: ^4.10.0
  share_plus: ^12.0.1
  file_saver: ^0.3.1
  printing: ^5.14.3
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_premium.png
    - assets/.env
    - assets/3d_editor.html
    - assets/3d_house_viewer.html
    - assets/panorama_viewer.html
    - assets/3d_model_viewer.html
    - assets/catalog/
