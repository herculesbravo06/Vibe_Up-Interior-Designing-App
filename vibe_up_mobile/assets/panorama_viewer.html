<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>360 Panorama Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #D4AF37;
            z-index: 10; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(212,175,55,0.3);
            border-top: 4px solid #D4AF37; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #errorMsg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #CF6679; display: none; text-align: center;
        }
    </style>
    <!-- Three.js ES Modules Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading High-Res Panorama...</div>
    </div>
    <div id="errorMsg">Failed to load panorama.</div>

<script type="module">
import * as THREE from 'three';

let camera, scene, renderer;

let isUserInteracting = false,
    onPointerDownMouseX = 0, onPointerDownMouseY = 0,
    lon = 0, onPointerDownLon = 0,
    lat = 0, onPointerDownLat = 0,
    phi = 0, theta = 0;

let initialPinchDistance = null;
let initialFov = 75;

// Parse the imageUrl from the URL query string
const urlParams = new URLSearchParams(window.location.search);
const imageUrl = urlParams.get('url') || 'https://images.unsplash.com/photo-1557804506-669a67965ba0?ixlib=rb-4.0.3&auto=format&fit=crop&w=2560&q=80'; // Fallback equirectangular image

init();
animate();

function init() {
    const container = document.createElement('div');
    document.body.appendChild(container);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
    camera.target = new THREE.Vector3(0, 0, 0);

    scene = new THREE.Scene();

    const geometry = new THREE.SphereGeometry(500, 60, 40);
    // invert the geometry on the x-axis so that all of the faces point inward
    geometry.scale(-1, 1, 1);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.crossOrigin = 'Anonymous';
    
    textureLoader.load(imageUrl, function(texture) {
        texture.colorSpace = THREE.SRGBColorSpace;
        const material = new THREE.MeshBasicMaterial({ map: texture });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        
        // Hide loading
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

        // Notify Flutter wrapper
        if (window.Print != undefined) {
             try {
                Print.postMessage(JSON.stringify({ event: 'ready' }));
             } catch(e) {}
        }
    }, 
    // onProgress callback
    function ( xhr ) {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        if(!isNaN(percent)) {
            document.getElementById('loadingText').innerText = `Loading High-Res Panorama... ${percent}%`;
        }
    },
    // onError callback
    function ( err ) {
        console.error('An error happened', err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
    });

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);
    container.style.touchAction = 'none';

    // Event listeners for desktop
    container.addEventListener('pointerdown', onPointerDown);
    document.addEventListener('wheel', onDocumentMouseWheel);

    // Event listeners for mobile pinch zoom
    container.addEventListener('touchstart', onTouchStart, { passive: false });
    container.addEventListener('touchmove', onTouchMove, { passive: false });
    container.addEventListener('touchend', onTouchEnd);

    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function onPointerDown(event) {
    if (event.isPrimary === false) return;
    isUserInteracting = true;
    onPointerDownMouseX = event.clientX;
    onPointerDownMouseY = event.clientY;
    onPointerDownLon = lon;
    onPointerDownLat = lat;
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
}

function onPointerMove(event) {
    if (event.isPrimary === false) return;
    lon = (onPointerDownMouseX - event.clientX) * 0.15 + onPointerDownLon;
    lat = (event.clientY - onPointerDownMouseY) * 0.15 + onPointerDownLat;
}

function onPointerUp(event) {
    if (event.isPrimary === false) return;
    isUserInteracting = false;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
}

function onDocumentMouseWheel(event) {
    const fov = camera.fov + event.deltaY * 0.05;
    camera.fov = THREE.MathUtils.clamp(fov, 30, 90);
    camera.updateProjectionMatrix();
}

// Mobile Touch Controls
function getPinchDistance(e) {
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }
    return null;
}

function onTouchStart(event) {
    if (event.touches.length === 1) {
        isUserInteracting = true;
        onPointerDownMouseX = event.touches[0].clientX;
        onPointerDownMouseY = event.touches[0].clientY;
        onPointerDownLon = lon;
        onPointerDownLat = lat;
    } else if (event.touches.length === 2) {
        isUserInteracting = false; // Stop dragging while pinching
        initialPinchDistance = getPinchDistance(event);
        initialFov = camera.fov;
    }
}

function onTouchMove(event) {
    event.preventDefault(); // Prevent scrolling
    
    if (event.touches.length === 1 && isUserInteracting) {
        lon = (onPointerDownMouseX - event.touches[0].clientX) * 0.3 + onPointerDownLon;
        lat = (event.touches[0].clientY - onPointerDownMouseY) * 0.3 + onPointerDownLat;
    } else if (event.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(event);
        if (currentDistance) {
            const scale = initialPinchDistance / currentDistance;
            let targetFov = initialFov * scale;
            camera.fov = THREE.MathUtils.clamp(targetFov, 30, 90);
            camera.updateProjectionMatrix();
        }
    }
}

function onTouchEnd() {
    isUserInteracting = false;
    initialPinchDistance = null;
}

function animate() {
    requestAnimationFrame(animate);
    update();
}

function update() {
    if (isUserInteracting === false) {
        // Very slow auto-rotation when idle
        lon -= 0.05;
    }

    lat = Math.max(-85, Math.min(85, lat));
    phi = THREE.MathUtils.degToRad(90 - lat);
    theta = THREE.MathUtils.degToRad(lon);

    camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
    camera.target.y = 500 * Math.cos(phi);
    camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

    camera.lookAt(camera.target);
    renderer.render(scene, camera);
}
</script>
</body>
</html>
