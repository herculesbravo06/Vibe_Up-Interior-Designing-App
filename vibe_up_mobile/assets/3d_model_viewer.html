<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>VibeUp 3D Tour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      overflow: hidden;
      background: #0a0a0c;
      font-family: 'Segoe UI', sans-serif;
      touch-action: none
    }

    #cc {
      width: 100vw;
      height: 100vh
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(20, 20, 25, .95);
      padding: 24px 50px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, .1);
      backdrop-filter: blur(15px);
      z-index: 1000;
      letter-spacing: 1px
    }

    .sp {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top: 3px solid #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #hud-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0;
      z-index: 50;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .15);
      backdrop-filter: blur(10px)
    }

    #hud-top button {
      background: rgba(0, 0, 0, .55);
      border: none;
      color: #aaa;
      padding: 10px 22px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s
    }

    #hud-top button.active {
      background: rgba(212, 175, 55, .25);
      color: #D4AF37
    }

    #zoom-ctrl {
      position: absolute;
      right: 14px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50
    }

    #zoom-ctrl button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(8px)
    }

    #floor-btns {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 50
    }

    #floor-btns button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer
    }

    #floor-btns button.active {
      background: rgba(212, 175, 55, .3);
      color: #D4AF37;
      border-color: rgba(212, 175, 55, .4)
    }

    #room-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 50;
      padding: 8px 16px;
      background: rgba(0, 0, 0, .65);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .08);
      max-width: 90vw;
      overflow-x: auto
    }

    #room-bar button {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .06);
      color: #ccc;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s
    }

    #room-bar button:hover,
    #room-bar button.active {
      background: rgba(212, 175, 55, .2);
      color: #D4AF37;
      border-color: rgba(212, 175, 55, .3)
    }

    #room-label {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .7);
      color: #D4AF37;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .4s;
      z-index: 50;
      pointer-events: none;
      border: 1px solid rgba(212, 175, 55, .2)
    }

    #center-btn {
      position: absolute;
      right: 14px;
      bottom: 60px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      z-index: 50;
      backdrop-filter: blur(8px)
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="sp"></div>BUILDING HOUSE...
  </div>
  <div id="hud-top"><button id="btn2d" onclick="setViewMode('2d')">2D</button><button id="btn3d" class="active"
      onclick="setViewMode('3d')">3D</button></div>
  <div id="zoom-ctrl"><button onclick="zoomIn()">+</button><button onclick="zoomOut()">−</button></div>
  <button id="center-btn" onclick="centerView()">⊙</button>
  <div id="floor-btns"></div>
  <div id="room-bar"></div>
  <div id="room-label"></div>
  <div id="cc"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const categoryId = 'INJECT_CATEGORY_ID_HERE';

    // === THREE.JS CORE ===
    const container = document.getElementById('cc');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8d4c8);
    scene.fog = new THREE.FogExp2(0xb8d4c8, 0.006);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.05; controls.minPolarAngle = 0.05;
    controls.minDistance = 3; controls.maxDistance = 80;

    // === CAMERA ANIMATION ===
    let animating = false, animCamPos = null, animLookAt = null, animProgress = 0;
    function flyTo(pos, look) { animCamPos = pos.clone(); animLookAt = look.clone(); animProgress = 0; animating = true; }

    // === VIEW MODE ===
    let viewMode = '3d', saved3DPos = null, saved3DTarget = null;
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btn2d').className = mode === '2d' ? 'active' : '';
      document.getElementById('btn3d').className = mode === '3d' ? 'active' : '';
      if (mode === '2d') {
        saved3DPos = camera.position.clone(); saved3DTarget = controls.target.clone();
        const cx = controls.target.x, cz = controls.target.z;
        flyTo(new THREE.Vector3(cx, 45, cz + 0.01), new THREE.Vector3(cx, 0, cz));
        controls.maxPolarAngle = 0.01; controls.minPolarAngle = 0;
      } else {
        controls.maxPolarAngle = Math.PI / 2.05; controls.minPolarAngle = 0.05;
        if (saved3DPos) flyTo(saved3DPos, saved3DTarget);
      }
    }
    function zoomIn() { const d = camera.position.distanceTo(controls.target); if (d > 4) { camera.position.lerp(controls.target, 0.2); controls.update(); } }
    function zoomOut() { const dir = camera.position.clone().sub(controls.target).normalize(); camera.position.add(dir.multiplyScalar(3)); controls.update(); }
    function centerView() {
      const cx = houseCenterX || 0, cz = houseCenterZ || 0;
      flyTo(new THREE.Vector3(cx + 20, 18, cz + 20), new THREE.Vector3(cx, 0, cz));
    }

    // === LIGHTING ===
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xfffaf0, 1.0);
    sun.position.set(25, 35, 20); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
    sun.shadow.bias = -0.0002; scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88bbff, 0.3); fill.position.set(-20, 15, -10); scene.add(fill);

    // === THEME SYSTEM ===
    const THEMES = {
      modern: { wall: 0xf0ece4, trim: 0xd8d4cc, floor: 0xc4a882, tile: 0xe0ddd5, carpet: 0x8a7e73, darkWood: 0x4a3328, lightWood: 0xa07850, accent: 0x6b8e7b, sofa: 0x4a5568, bed: 0x5a6578, sky: 0xb8d4c8, rug: 0x6b5b4a },
      scandi: { wall: 0xf5f0eb, trim: 0xe8e2da, floor: 0xd4c4a8, tile: 0xf0ece6, carpet: 0xc5b8a8, darkWood: 0x8b7355, lightWood: 0xc8b48a, accent: 0x7ba7a7, sofa: 0xc8bfb0, bed: 0x9ab5b0, sky: 0xc8ddd5, rug: 0xb8a88a },
      luxury: { wall: 0xe8e0d0, trim: 0xc8b898, floor: 0x2a2018, tile: 0xd8d0c0, carpet: 0x1a1510, darkWood: 0x1a0f08, lightWood: 0x4a3520, accent: 0xb8963a, sofa: 0x1a2840, bed: 0x1a2030, sky: 0xa8b8b0, rug: 0x1a1510 },
      industrial: { wall: 0xc8c0b8, trim: 0xa8a098, floor: 0x3a3530, tile: 0xb8b0a8, carpet: 0x2a2520, darkWood: 0x2a1810, lightWood: 0x5a4030, accent: 0xa04020, sofa: 0x3a3028, bed: 0x4a3830, sky: 0xa0a8a0, rug: 0x3a3028 }
    };
    let TH = THEMES.modern;
    function applyTheme(cat) {
      if (cat.includes('2bhk')) TH = THEMES.scandi;
      else if (cat.includes('4bhk') || cat.includes('premium')) TH = THEMES.luxury;
      else if (cat === 'office') TH = THEMES.industrial;
      else if (cat.includes('5bhk') || cat.includes('villa')) TH = THEMES.luxury;
      else TH = THEMES.modern;
      scene.background = new THREE.Color(TH.sky);
      scene.fog = new THREE.FogExp2(TH.sky, 0.006);
    }

    // === MATERIAL SYSTEM ===
    const MC = {};
    function mt(c, r, m) { const k = c + '_' + r + '_' + m; if (!MC[k]) MC[k] = new THREE.MeshStandardMaterial({ color: c, roughness: r || .6, metalness: m || 0 }); return MC[k] }
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.25, roughness: 0.05, metalness: 0.1 });
    const METAL = 0xaaaaaa, WHITE = 0xf8f6f2;

    // === PROP HELPER ===
    function P(parent, geo, mat, x, y, z, rx, ry, rz) {
      const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0);
      if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
      m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
    }
    function Box(w, h, d) { return new THREE.BoxGeometry(w, h, d) }
    function Cyl(rT, rB, h, s) { return new THREE.CylinderGeometry(rT, rB, h, s || 16) }

    // === ROOM BUILDER ===
    const WH = 3.0, WT = 0.2;
    const allRoomGroups = [];
    const hotspots = [];
    let houseCenterX = 0, houseCenterZ = 0;
    let floorGroups = {};

    function buildRoom(cfg) {
      // cfg: name,x,z,w,d,skip[],wins[],accent,floorType,floor(1|2)
      const g = new THREE.Group(); g.name = cfg.name; g.position.set(cfg.x, 0, cfg.z);
      const fl = cfg.floor || 1;
      if (!floorGroups[fl]) floorGroups[fl] = new THREE.Group(), scene.add(floorGroups[fl]);
      floorGroups[fl].add(g);
      allRoomGroups.push(g);

      // Floor
      const fc = cfg.floorType === 'tile' ? TH.tile : cfg.floorType === 'carpet' ? TH.carpet : TH.floor;
      let floorMat;
      if (cfg.floorType !== 'tile' && cfg.floorType !== 'carpet') {
        if (!MC['wood_' + fc]) {
          const cvs = document.createElement('canvas'); cvs.width = 256; cvs.height = 256;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = '#' + fc.toString(16).padStart(6, '0'); ctx.fillRect(0, 0, 256, 256);
          ctx.fillStyle = '#' + Math.max(0, fc - 0x151515).toString(16).padStart(6, '0');
          ctx.fillRect(0, 0, 6, 256); ctx.fillRect(128, 0, 6, 256);
          ctx.fillRect(0, 126, 128, 6); ctx.fillRect(128, 250, 128, 6);
          const tex = new THREE.CanvasTexture(cvs);
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          MC['wood_' + fc] = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, color: 0xffffff });
        }
        floorMat = MC['wood_' + fc];
      } else {
        floorMat = mt(fc, .85);
      }

      const floorGeo = Box(cfg.w, .12, cfg.d);
      if (cfg.floorType !== 'tile' && cfg.floorType !== 'carpet') {
        const uv = floorGeo.attributes.uv.array;
        for (let i = 0; i < uv.length; i += 2) {
          uv[i] *= Math.ceil(cfg.w / 0.8);
          uv[i + 1] *= Math.ceil(cfg.d / 1.2);
        }
      }
      P(g, floorGeo, floorMat, 0, .06, 0);

      // Walls
      const skip = cfg.skip || []; const wins = cfg.wins || []; const acc = cfg.accent || '';
      const walls = [
        { id: 'n', w: cfg.w + WT, d: WT, x: 0, z: -cfg.d / 2 },
        { id: 's', w: cfg.w + WT, d: WT, x: 0, z: cfg.d / 2 },
        { id: 'e', w: WT, d: cfg.d, x: cfg.w / 2, z: 0 },
        { id: 'w', w: WT, d: cfg.d, x: -cfg.w / 2, z: 0 }
      ];
      walls.forEach(wl => {
        if (skip.includes(wl.id)) return;
        const wc = acc === wl.id ? TH.accent : TH.wall;
        if (wins.includes(wl.id)) {
          // Wall with window: bottom strip + top strip + glass
          P(g, Box(wl.w, .8, wl.d), mt(wc, .9), wl.x, .4, wl.z);
          P(g, Box(wl.w, .6, wl.d), mt(wc, .9), wl.x, WH - .3, wl.z);
          P(g, Box(wl.w - .4, WH - 1.4, .03), glassMat, wl.x, WH / 2, wl.z);
          // Mullion
          P(g, Box(.06, WH - 1.4, .08), mt(WHITE, .4), wl.x, WH / 2, wl.z);
          // Sill
          P(g, Box(wl.w - .2, .06, .15), mt(TH.trim, .5), wl.x, .78, wl.z + (wl.id === 'n' ? .08 : -.08));
        } else {
          P(g, Box(wl.w, WH, wl.d), mt(wc, .9), wl.x, WH / 2, wl.z);
        }
        // Baseboard
        const bz = wl.id === 'n' ? wl.z + .08 : wl.id === 's' ? wl.z - .08 : wl.z;
        const bx = wl.id === 'e' ? wl.x - .08 : wl.id === 'w' ? wl.x + .08 : wl.x;
        P(g, Box(wl.id === 'e' || wl.id === 'w' ? .06 : wl.w - .3, .12, wl.id === 'e' || wl.id === 'w' ? cfg.d - .3 : .06), mt(TH.trim, .5), bx, .06, bz);
      });


      // No ceiling - open top like Planner5D so user can see inside

      // Hotspot
      const hGeo = new THREE.CircleGeometry(.5, 24);
      const hMat = new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0.35, roughness: 1 });
      const hMesh = new THREE.Mesh(hGeo, hMat);
      hMesh.rotation.x = -Math.PI / 2; hMesh.position.set(0, .14, 0);
      hMesh.userData = {
        isHotspot: true, roomName: cfg.name,
        camPos: new THREE.Vector3(cfg.x + (cfg.w * .6), WH * 2.5, cfg.z + (cfg.d * .8)),
        lookAt: new THREE.Vector3(cfg.x, 0, cfg.z)
      };
      g.add(hMesh); hotspots.push(hMesh);
      return g;
    }

    // === DOOR BUILDER ===
    function addDoor(room, wall, pos, w) {
      // Adds a door cutout visual on a wall
      const dw = w || 1.0, dh = 2.2;
      const g = new THREE.Group();
      const frameMat = mt(TH.darkWood, .6);
      // Frame
      P(g, Box(.08, dh, .15), frameMat, -dw / 2, dh / 2, 0);
      P(g, Box(.08, dh, .15), frameMat, dw / 2, dh / 2, 0);
      P(g, Box(dw + .16, .08, .15), frameMat, 0, dh, 0);
      if (wall === 'n') g.position.set(pos, 0, -room.userData?.d / 2 || 0);
      else if (wall === 's') g.position.set(pos, 0, room.userData?.d / 2 || 0);
      room.add(g); return g;
    }

    // === FURNITURE BUILDERS ===
    function furnishLiving(r, w, d) {
      // L-shaped sofa
      const sofaMat = mt(TH.sofa, .85);
      P(r, Box(2.4, .35, 1.0), sofaMat, w * .15, .3, d * .2);
      P(r, Box(2.4, .5, .12), sofaMat, w * .15, .6, d * .2 - .44);
      P(r, Box(.12, .5, 1.0), sofaMat, w * .15 - 1.14, .6, d * .2);
      P(r, Box(.12, .5, 1.0), sofaMat, w * .15 + 1.14, .6, d * .2);
      // Extension piece
      P(r, Box(1.0, .35, .8), sofaMat, w * .15 + .7, .3, d * .2 + .9);
      // Cushions
      const cushMat = mt(TH.sofa + 0x111010, .9);
      P(r, Box(.7, .12, .6), cushMat, w * .15 - .4, .52, d * .2 + .1);
      P(r, Box(.7, .12, .6), cushMat, w * .15 + .4, .52, d * .2 + .1);
      // Coffee table
      P(r, Box(1.0, .06, .55), mt(TH.lightWood, .7), w * .15, .42, d * .2 - 1.5);
      P(r, Cyl(.03, .03, .4), mt(METAL, .2, .7), w * .15 - .35, .2, d * .2 - 1.5);
      P(r, Cyl(.03, .03, .4), mt(METAL, .2, .7), w * .15 + .35, .2, d * .2 - 1.5);
      // Decor on table
      P(r, Cyl(.08, .06, .18), mt(TH.accent, .4, .3), w * .15 + .2, .52, d * .2 - 1.5);
      P(r, Box(.25, .04, .18), mt(TH.accent - 0x111111, .8), w * .15 - .2, .45, d * .2 - 1.5);
      // Area rug
      P(r, Box(3, .02, 2), mt(TH.rug, .95), w * .15, .02, d * .2 - .5);
      P(r, Box(2.7, .025, 1.7), mt(TH.rug + 0x101010, .95), w * .15, .025, d * .2 - .5);
      // TV setup
      P(r, Box(2.0, .06, .35), mt(TH.darkWood, .4, .2), w * .15, .28, -d * .35);
      P(r, Box(1.8, .9, .04), mt(0x111111, .1, .5), w * .15, 1.0, -d * .35);
      P(r, Box(1.7, .8, .01), mt(0x0a0a1a, .05), w * .15, 1.0, -d * .35 + .03);
      // Wall art next to TV
      P(r, Box(.8, .6, .02), mt(WHITE, .8, .1), w * .15 + 1.5, 1.2, -d * .35);
      P(r, Box(.7, .5, .01), mt(TH.accent, .6, .2), w * .15 + 1.5, 1.2, -d * .35 + .015);
      // Floor lamp
      P(r, Cyl(.12, .15, .04), mt(METAL, .3, .5), w * .35, .02, d * .25);
      P(r, Cyl(.02, .02, 1.4), mt(METAL, .3, .6), w * .35, .72, d * .25);
      P(r, Cyl(.05, .18, .25), mt(0xfff5e0, .9), w * .35, 1.52, d * .25);
      const ll = new THREE.PointLight(0xfff0d0, .4, 5); ll.position.set(w * .35, 1.5, d * .25); r.add(ll);
      // Bookshelf
      P(r, Box(.9, 1.8, .28), mt(TH.darkWood, .7), -w * .38, .9, -d * .35);
      for (let i = 0; i < 4; i++)P(r, Box(.82, .03, .26), mt(TH.lightWood, .7), -w * .38, .22 + i * .45, -d * .35);
      const bc = [0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad];
      for (let s = 0; s < 3; s++) {
        let bx = -.2; for (let b = 0; b < 4; b++) {
          const bh = .18 + Math.random() * .1, bw = .06 + Math.random() * .04;
          P(r, Box(bw, bh, .16), mt(bc[(s + b) % 5]), -w * .38 + bx, .25 + s * .45 + bh / 2, -d * .35); bx += bw + .02;
        }
      }
      // Plants & Decor
      P(r, Cyl(.1, .08, .2), mt(TH.darkWood, .7), w * .38, .1, -d * .3);
      P(r, new THREE.SphereGeometry(.15, 8, 6), mt(0x2e7d32, .8), w * .38, .35, -d * .3);
      P(r, Cyl(.08, .06, .15), mt(WHITE, .3), w * .38 + 0.5, .07, -d * .3);
      P(r, new THREE.SphereGeometry(.12, 8, 6), mt(0x388e3c, .8), w * .38 + 0.5, .25, -d * .3);
    }

    function furnishKitchen(r, w, d) {
      // Counter along one wall
      P(r, Box(w * .8, .85, .55), mt(TH.darkWood, .5), -w * .05, .425, -d * .35);
      P(r, Box(w * .8 + .05, .05, .6), mt(TH.tile, .15, .1), -w * .05, .9, -d * .35);
      // Upper cabinets
      P(r, Box(w * .6, .5, .3), mt(TH.trim, .6), -w * .1, 2.1, -d * .35);
      // Island
      P(r, Box(1.8, .85, .7), mt(TH.darkWood, .5), 0, .425, d * .05);
      P(r, Box(1.85, .05, .75), mt(TH.tile, .15, .1), 0, .9, d * .05);
      // Bar stools
      for (let i = -1; i <= 1; i++) {

    function furnishOffice(r, w, d, type) {
      if (type === 'reception') {
        P(r, Box(2.0, .9, .6), mt(TH.darkWood, .5), 0, .45, -d * .3);
        P(r, Box(2.05, .05, .65), mt(WHITE, .15, .1), 0, .93, -d * .3);

        P(r, new THREE.SphereGeometry(.2, 8, 6), mt(0x2e7d32, .8), w * .3, .35, d * .2);
        P(r, Box(1.5, .02, 1.5), mt(TH.rug, .95), 0, .02, 0);
      } else if (type === 'meeting') {
        P(r, Box(2.4, .08, 1.2), mt(TH.darkWood, .6), 0, .78, 0);
        for (let i = -1; i <= 1; i++)for (let j = -1; j <= 1; j += 2) {
          P(r, Box(.42, .06, .42), mt(TH.sofa), i * .7, .42, j * .8);
          P(r, Box(.42, .5, .05), mt(TH.bed), i * .7, .72, j * .8 + (j > 0 ? .18 : -.18));
        }
      } else if (type === 'workspace') {
        for (let i = 0; i < 4; i++) {
          const dx = -w * .3 + i * (w * .2), dz = 0;
          P(r, Box(1.2, .05, .6), mt(TH.lightWood, .6), dx, .75, dz);
          for (let l = 0; l < 4; l++)P(r, Cyl(.02, .02, .75), mt(METAL, .2, .6), dx + (l % 2 ? .5 : -.5), .375, dz + (l < 2 ? .25 : -.25));
          P(r, Box(.35, .02, .25), mt(0x333333, .2, .3), dx, .78, dz);
          P(r, Box(.45, .06, .45), mt(0x1a1a1a), dx, .42, dz + .6);
        }
      } else if (type === 'break') {
        P(r, Cyl(.5, .5, .05), mt(WHITE, .3), 0, .78, 0);
        P(r, Cyl(.06, .06, .78), mt(METAL, .2, .7), 0, .39, 0);
        for (let i = 0; i < 3; i++) {
          const a = i * Math.PI * 2 / 3;
          P(r, Box(.4, .06, .4), mt(0x4a5568), .8 * Math.cos(a), .42, .8 * Math.sin(a));
        }
        P(r, Box(.6, 1.7, .55), mt(METAL, .2, .5), w * .35, .85, -d * .3);
      }
    }

    // === EXTERIOR ===
    function buildExterior(cx, cz, totalW, totalD) {
      // Ground
      P(scene, Box(totalW + 30, .08, totalD + 30), mt(0x4a8f3f, .9), cx, -.04, cz);
      // Fence
      const fw = totalW + 8, fd = totalD + 8;
      [[-fw / 2, 0, 'z', fd], [fw / 2, 0, 'z', fd], [0, 0, 'x', fw]].forEach(f => {
        for (let i = 0; i < Math.floor(f[3] / .8); i++) {
          const fi = -.45 * f[3] + i * .8;
          if (f[2] === 'z') P(scene, Box(.06, .8, .04), mt(0xc8a882, .7), cx + f[0], 0.4, cz + fi);
          else P(scene, Box(.04, .8, .06), mt(0xc8a882, .7), cx + fi, 0.4, cz - fd / 2);
        }
        if (f[2] === 'z') {
          P(scene, Box(.04, .05, f[3]), mt(0xb09870, .7), cx + f[0], .78, cz);
          P(scene, Box(.04, .05, f[3]), mt(0xb09870, .7), cx + f[0], .3, cz);
        } else {
          P(scene, Box(f[3], .05, .04), mt(0xb09870, .7), cx, .78, cz - fd / 2);
          P(scene, Box(f[3], .05, .04), mt(0xb09870, .7), cx, .3, cz - fd / 2);
        }
      });
      // Trees
      [[-8, -8], [8, -6], [-6, 8], [10, 6], [-10, 0], [12, -2]].forEach(t => {
        P(scene, Cyl(.08, .12, 1.5), mt(0x5d4037, .7), cx + t[0], .75, cz + t[1]);
        P(scene, new THREE.SphereGeometry(.6, 8, 6), mt(0x2e7d32, .8), cx + t[0], 1.8, cz + t[1]);
        P(scene, new THREE.SphereGeometry(.4, 8, 6), mt(0x388e3c, .8), cx + t[0] + .3, 1.5, cz + t[1] + .2);
      });
      // Pathway
      for (let i = 0; i < 8; i++)P(scene, Cyl(.25, .25, .04, 6), mt(0x9e9e9e + Math.floor(Math.random() * 0x111111), .7), cx, 0.02, cz + totalD / 2 + 1 + i * .6);
    }

    }

    function generate4BHK() {
      const lv = buildRoom({ name: 'Living Room', x: 0, z: 0, w: 10, d: 7, wins: ['e', 's'], accent: 'n' });
      furnishLiving(lv, 10, 7);
      const kt = buildRoom({ name: 'Kitchen', x: 0, z: -7.5, w: 10, d: 5.5, skip: ['s'], wins: ['e'] });
      furnishKitchen(kt, 10, 5.5);
      const dn = buildRoom({ name: 'Dining', x: 0, z: -13.5, w: 10, d: 5, skip: ['s'] });
      furnishDining(dn, 10, 5);
      const b1 = buildRoom({ name: 'Master Bedroom', x: -10.5, z: 0, w: 7, d: 6, skip: ['e'], wins: ['w'], accent: 'w' });
      furnishMasterBed(b1, 7, 6);
      const b2 = buildRoom({ name: 'Bedroom 2', x: -10.5, z: -6.5, w: 7, d: 5.5, skip: ['e'], wins: ['w'] });
      furnishBedroom(b2, 7, 5.5);
      const b3 = buildRoom({ name: 'Bedroom 3', x: 10.5, z: 0, w: 6, d: 5.5, skip: ['w'], wins: ['e'] });
      furnishBedroom(b3, 6, 5.5);
      const b4 = buildRoom({ name: 'Bedroom 4', x: 10.5, z: -6, w: 6, d: 5, skip: ['w'], wins: ['e'] });
      furnishBedroom(b4, 6, 5);
      const st = buildRoom({ name: 'Study', x: 10.5, z: -12, w: 6, d: 4.5, skip: ['w'] });
      furnishStudy(st, 6, 4.5);
      const bt1 = buildRoom({ name: 'Bathroom 1', x: -10.5, z: -12.5, w: 5, d: 3.5, floorType: 'tile' });
      furnishBathroom(bt1, 5, 3.5);
      const bt2 = buildRoom({ name: 'Bathroom 2', x: 10.5, z: 5, w: 4.5, d: 3.5, floorType: 'tile' });
      furnishBathroom(bt2, 4.5, 3.5);
      const hl = buildRoom({ name: 'Hallway', x: -4, z: -13.5, w: 3, d: 5, skip: ['e', 's'] });
      furnishHallway(hl, 3, 5);
      buildExterior(0, -5, 30, 28);
      houseCenterX = 0; houseCenterZ = -5;
      camera.position.set(24, 22, 24); controls.target.set(0, 0, -5);
    }

    function generate5BHK() {
      // Floor 1
      const lv = buildRoom({ name: 'Living Room', x: 0, z: 0, w: 11, d: 8, wins: ['e', 's'], accent: 'n', floor: 1 });
      furnishLiving(lv, 11, 8);
      const kt = buildRoom({ name: 'Kitchen', x: 0, z: -8.5, w: 11, d: 6, skip: ['s'], wins: ['e'], floor: 1 });
      furnishKitchen(kt, 11, 6);
      const dn = buildRoom({ name: 'Dining', x: 0, z: -15, w: 11, d: 5.5, skip: ['s'], floor: 1 });
      furnishDining(dn, 11, 5.5);
      const b1 = buildRoom({ name: 'Master Bedroom', x: -11.5, z: 0, w: 7.5, d: 6.5, skip: ['e'], wins: ['w'], accent: 'w', floor: 1 });
      furnishMasterBed(b1, 7.5, 6.5);
      const bt1 = buildRoom({ name: 'Bathroom 1', x: -11.5, z: -7, w: 5, d: 4, floorType: 'tile', floor: 1 });
      furnishBathroom(bt1, 5, 4);
      const hl1 = buildRoom({ name: 'Hallway', x: -7, z: -15, w: 3.5, d: 5.5, skip: ['e', 's'], floor: 1 });
      furnishHallway(hl1, 3.5, 5.5);
      // Floor 2
      const b2 = buildRoom({ name: 'Bedroom 2', x: 0, z: 0, w: 7, d: 6, wins: ['e'], floor: 2 });
      furnishBedroom(b2, 7, 6);
      const b3 = buildRoom({ name: 'Bedroom 3', x: -7.5, z: 0, w: 6, d: 6, skip: ['e'], wins: ['w'], floor: 2 });
      furnishBedroom(b3, 6, 6);
      const b4 = buildRoom({ name: 'Bedroom 4', x: 0, z: -6.5, w: 7, d: 5.5, wins: ['e'], floor: 2 });
      furnishBedroom(b4, 7, 5.5);
      const b5 = buildRoom({ name: 'Bedroom 5', x: -7.5, z: -6.5, w: 6, d: 5.5, skip: ['e'], floor: 2 });
      furnishBedroom(b5, 6, 5.5);
      const st = buildRoom({ name: 'Study', x: 7.5, z: 0, w: 5.5, d: 5, skip: ['w'], floor: 2 });
      furnishStudy(st, 5.5, 5);
      const bt2 = buildRoom({ name: 'Bathroom 2', x: 7.5, z: -5.5, w: 5.5, d: 3.5, floorType: 'tile', floor: 2 });
      furnishBathroom(bt2, 5.5, 3.5);
      const bt3 = buildRoom({ name: 'Bathroom 3', x: -7.5, z: -12.5, w: 5, d: 3.5, floorType: 'tile', floor: 2 });
      furnishBathroom(bt3, 5, 3.5);
      // Pool
      P(scene, Box(8, .2, 4), mt(0x29b6f6, .1, .3), 12, .1, 0);
      P(scene, Box(7.6, .15, 3.6), mt(0x00aaff, .05, .1), 12, .18, 0);
      // Hide floor 2 initially
      if (floorGroups[2]) floorGroups[2].visible = false;
      // Floor buttons
      const fb = document.getElementById('floor-btns'); fb.style.display = 'flex';
      [1, 2].forEach(f => {
        const b = document.createElement('button'); b.textContent = f;
        b.className = f === 1 ? 'active' : '';
        b.onclick = () => {
          Object.keys(floorGroups).forEach(k => { floorGroups[k].visible = (parseInt(k) === f) });
          fb.querySelectorAll('button').forEach(x => x.className = ''); b.className = 'active';
          updateRoomBar();
        };
        fb.appendChild(b);
      });
      buildExterior(-2, -6, 35, 30);
      houseCenterX = -2; houseCenterZ = -6;
      camera.position.set(26, 24, 26); controls.target.set(-2, 0, -6);
    }

    function generateOffice() {
      const rc = buildRoom({ name: 'Reception', x: 0, z: 0, w: 8, d: 6, wins: ['s'], accent: 'n' });
      furnishOffice(rc, 8, 6, 'reception');
      const mt_ = buildRoom({ name: 'Meeting Room', x: 9, z: 0, w: 6, d: 6, skip: ['w'], wins: ['e'] });
      furnishOffice(mt_, 6, 6, 'meeting');
      const ws = buildRoom({ name: 'Workspace', x: 0, z: -7, w: 14, d: 8, skip: ['s'], wins: ['e', 'w'] });
      furnishOffice(ws, 14, 8, 'workspace');
      const br = buildRoom({ name: 'Break Room', x: 0, z: -15.5, w: 7, d: 5, skip: ['s'] });
      furnishOffice(br, 7, 5, 'break');
      const mg = buildRoom({ name: 'Manager Cabin', x: 8, z: -15.5, w: 6, d: 5, skip: ['w'], wins: ['e'], accent: 'e' });
      furnishStudy(mg, 6, 5);
      buildExterior(4, -7, 26, 24);
      houseCenterX = 4; houseCenterZ = -7;
      camera.position.set(22, 18, 20); controls.target.set(4, 0, -7);
    }

    // === ROOM NAV BAR ===
    function updateRoomBar() {
      const bar = document.getElementById('room-bar'); bar.innerHTML = '';
      hotspots.forEach(h => {
        if (!h.parent || !h.parent.parent) return;
        const vis = h.parent.parent.visible !== false;
        if (!vis) return;
        const b = document.createElement('button'); b.textContent = h.userData.roomName;
        b.onclick = () => {
          flyTo(h.userData.camPos, h.userData.lookAt);
          showRoomLabel(h.userData.roomName);
          bar.querySelectorAll('button').forEach(x => x.className = ''); b.className = 'active';
        };
        bar.appendChild(b);
      });
    }

    function showRoomLabel(name) {
      const el = document.getElementById('room-label'); el.textContent = name; el.style.opacity = '1';
      setTimeout(() => el.style.opacity = '0', 2000);
    }

    // === HOTSPOT CLICK ===
    const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
    renderer.domElement.addEventListener('click', e => {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hMeshes = hotspots.filter(h => h.parent && h.parent.parent && h.parent.parent.visible !== false);
      const hits = raycaster.intersectObjects(hMeshes, false);
      if (hits.length > 0) {
        const h = hits[0].object;
        flyTo(h.userData.camPos, h.userData.lookAt);
        showRoomLabel(h.userData.roomName);
      }
    });

    // === INIT ===
    let cat = categoryId; if (cat.includes('INJECT')) cat = '2bhk';
    applyTheme(cat);
    if (cat === '1bhk') generate1BHK();
    else if (cat === '2bhk') generate2BHK();
    else if (cat === '3bhk') generate3BHK();
    else if (cat.includes('4bhk') || cat.includes('premium')) generate4BHK();
    else if (cat.includes('5bhk') || cat.includes('villa')) generate5BHK();
    else if (cat === 'office') generateOffice();
    else generate2BHK();

    updateRoomBar(); controls.update();
    setTimeout(() => {
      const ld = document.getElementById('loading'); ld.style.opacity = '0';
      setTimeout(() => ld.style.display = 'none', 800);
      if (window.Print) Print.postMessage(JSON.stringify({ event: 'ready' }));
    }, 1200);

    // === ANIMATION ===
    function animate() {
      requestAnimationFrame(animate);
      if (animating && animCamPos) {
        animProgress += 0.025;
        camera.position.lerp(animCamPos, 0.04);
        controls.target.lerp(animLookAt, 0.04);
        if (animProgress >= 1) { animating = false; }
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>

</html>
