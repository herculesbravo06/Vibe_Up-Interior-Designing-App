<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Interior Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Selection indicator */
    #selection-info {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 14px;
      background: rgba(30, 30, 46, 0.88);
      border-radius: 10px;
      color: #D4AF37;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #selection-info.visible {
      opacity: 1;
    }

    /* Drop zone indicator */
    #drop-indicator {
      position: absolute;
      inset: 0;
      border: 3px dashed rgba(212, 175, 55, 0.6);
      border-radius: 16px;
      background: rgba(212, 175, 55, 0.05);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #drop-indicator.active {
      opacity: 1;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 100;
      color: #D4AF37;
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="canvas-container">
    <div id="loading">Loading 3D Editorâ€¦</div>
    <div id="selection-info"></div>
    <div id="drop-indicator"></div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // â”€â”€â”€ Scene Setup â”€â”€â”€
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f2f5); // Brighter background
    scene.fog = new THREE.Fog(0xf0f2f5, 18, 40);

    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
    // Position camera to see the whole room from a nice elevated angle (Planner 5D style)
    camera.position.set(0, 14, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // â”€â”€â”€ Orbit Controls â”€â”€â”€
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minPolarAngle = 0.1;
    controls.minDistance = 1.5;
    controls.maxDistance = 18;
    controls.target.set(0, 0.5, 0);
    controls.enablePan = true;
    controls.panSpeed = 0.8;
    controls.zoomSpeed = 1.2;

    // â”€â”€â”€ Lighting â”€â”€â”€
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    mainLight.position.set(3, 6, 4);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(1024, 1024);
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 20;
    mainLight.shadow.camera.left = -6;
    mainLight.shadow.camera.right = 6;
    mainLight.shadow.camera.top = 6;
    mainLight.shadow.camera.bottom = -6;
    mainLight.shadow.bias = -0.002;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xd4e5ff, 0.4);
    fillLight.position.set(-3, 8, -2);
    scene.add(fillLight);

    const pointLight = new THREE.PointLight(0xD4AF37, 0.4, 10);
    pointLight.position.set(0, 3.5, 0);
    scene.add(pointLight);

    // â”€â”€â”€ Materials â”€â”€â”€
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xb58b66, roughness: 0.8, metalness: 0.05 });
    const wallMatIn = new THREE.MeshStandardMaterial({ color: 0xfdfdfd, roughness: 0.95 });
    const wallMatOut = new THREE.MeshStandardMaterial({ color: 0x5a4d44, roughness: 0.95 });
    const wallMatTop = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.95 });
    const wallMaterials = [
      wallMatOut, // +x
      wallMatOut, // -x
      wallMatTop, // +y
      wallMatTop, // -y
      wallMatIn,  // +z (front)
      wallMatOut, // -z (back)
    ];

    // â”€â”€â”€ Room Geometry â”€â”€â”€
    let ROOM_W = 8, ROOM_D = 8;
    const ROOM_H = 3.0;

    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    floor.name = 'floor';
    scene.add(floor);

    // Floor grid
    const gridHelper = new THREE.GridHelper(ROOM_W, 16, 0x8c6b4f, 0x9c7b5f);
    gridHelper.position.y = 0.005;
    scene.add(gridHelper);

    // Walls
    const dynamicWalls = [];

    function createWall(w, h, pos, rotY) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, h, 0.2), wallMaterials);
      wall.position.copy(pos);
      // Shift by 0.1 on local Z so the inner face aligns perfectly with the room edge
      wall.position.add(new THREE.Vector3(0, 0, -0.1).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY));
      wall.rotation.y = rotY;
      wall.receiveShadow = true;
      wall.castShadow = true;
      wall.name = 'wall';

      // Store the inward normal for dynamic culling
      wall.userData.inwardNormal = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);

      scene.add(wall);
      dynamicWalls.push(wall);
    }
    createWall(ROOM_W, ROOM_H, new THREE.Vector3(0, ROOM_H / 2, -ROOM_D / 2), 0);
    createWall(ROOM_W, ROOM_H, new THREE.Vector3(0, ROOM_H / 2, ROOM_D / 2), Math.PI);
    createWall(ROOM_D, ROOM_H, new THREE.Vector3(-ROOM_W / 2, ROOM_H / 2, 0), Math.PI / 2);
    createWall(ROOM_D, ROOM_H, new THREE.Vector3(ROOM_W / 2, ROOM_H / 2, 0), -Math.PI / 2);

    // Baseboard trim
    const baseboardMat = new THREE.MeshStandardMaterial({ color: 0xf0e6d3, roughness: 0.5 });
    function addBaseboard(length, pos, rotY) {
      const bb = new THREE.Mesh(new THREE.BoxGeometry(length, 0.1, 0.04), baseboardMat);
      bb.position.copy(pos);
      bb.rotation.y = rotY;
      bb.name = 'baseboard';
      bb.userData.inwardNormal = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
      scene.add(bb);
      dynamicWalls.push(bb);
    }
    addBaseboard(ROOM_W, new THREE.Vector3(0, 0.05, -ROOM_D / 2 + 0.02), 0);
    addBaseboard(ROOM_W, new THREE.Vector3(0, 0.05, ROOM_D / 2 - 0.02), Math.PI);
    addBaseboard(ROOM_D, new THREE.Vector3(-ROOM_W / 2 + 0.02, 0.05, 0), Math.PI / 2);
    addBaseboard(ROOM_D, new THREE.Vector3(ROOM_W / 2 - 0.02, 0.05, 0), -Math.PI / 2);

    // â”€â”€â”€ Furniture System â”€â”€â”€
    const furnitureObjects = [];
    let selectedObject = null;
    const selectionInfo = document.getElementById('selection-info');
    const dropIndicator = document.getElementById('drop-indicator');

    // Track placed items with metadata (name, price, category)
    const placedItemsData = [];

    const furnitureDefs = {

      shed: { build: buildShed, label: 'Shed' },

    };

    function makeMat(color, roughness = 0.6, metalness = 0.05) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    function addM(g, geo, mat, x, y, z, shadow = false, rx = 0, ry = 0, rz = 0) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      if (rx || ry || rz) m.rotation.set(rx, ry, rz);
      m.castShadow = shadow;
      g.add(m);
      return m;
    }

    function buildSofa() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(2.0, 0.4, 0.9), makeMat(0x4a6fa5), 0, 0.35, 0, true);
      addM(g, new THREE.BoxGeometry(2.0, 0.5, 0.15), makeMat(0x3d5f8a), 0, 0.7, -0.38, true);
      addM(g, new THREE.BoxGeometry(0.15, 0.35, 0.9), makeMat(0x3d5f8a), -0.93, 0.52, 0, true);
      addM(g, new THREE.BoxGeometry(0.15, 0.35, 0.9), makeMat(0x3d5f8a), 0.93, 0.52, 0, true);
      const legMat = makeMat(0x2c2c2e, 0.4, 0.3);
      [[-0.85, -0.35], [0.85, -0.35], [-0.85, 0.35], [0.85, 0.35]].forEach(([x, z]) => {
        addM(g, new THREE.CylinderGeometry(0.03, 0.03, 0.15), legMat, x, 0.075, z);
      });
      [[-0.45, 0], [0.45, 0]].forEach(([x, z]) => {
        addM(g, new THREE.BoxGeometry(0.8, 0.12, 0.7), makeMat(0x5a7fb5, 0.8), x, 0.61, 0.05, true);
      });
      return g;
    }

    function buildChair() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(0.55, 0.08, 0.55), makeMat(0xc49a6c), 0, 0.45, 0, true);
      addM(g, new THREE.BoxGeometry(0.55, 0.6, 0.06), makeMat(0xb08850), 0, 0.75, -0.25, true);
      const lMat = makeMat(0x2c2c2e, 0.4, 0.3);
      [[-0.22, -0.22], [0.22, -0.22], [-0.22, 0.22], [0.22, 0.22]].forEach(([x, z]) => {
        addM(g, new THREE.CylinderGeometry(0.02, 0.02, 0.45), lMat, x, 0.225, z);
      });
      return g;
    }

    function buildTable() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(1.0, 0.06, 0.6), makeMat(0x8B6F47), 0, 0.4, 0, true);
      const lMat = makeMat(0x2c2c2e, 0.4, 0.3);
      [[-0.42, -0.22], [0.42, -0.22], [-0.42, 0.22], [0.42, 0.22]].forEach(([x, z]) => {
        addM(g, new THREE.CylinderGeometry(0.025, 0.025, 0.4), lMat, x, 0.2, z);
      });
      return g;
    }

    function buildDiningTable() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(1.6, 0.07, 0.9), makeMat(0x6B4226), 0, 0.75, 0, true);
      const lMat = makeMat(0x2c2c2e, 0.3, 0.4);
      [[-0.7, -0.35], [0.7, -0.35], [-0.7, 0.35], [0.7, 0.35]].forEach(([x, z]) => {
        addM(g, new THREE.BoxGeometry(0.06, 0.75, 0.06), lMat, x, 0.375, z);
      });
      return g;
    }

    function buildLamp() {
      const g = new THREE.Group();
      addM(g, new THREE.CylinderGeometry(0.15, 0.18, 0.04), makeMat(0x2c2c2e, 0.3, 0.5), 0, 0.02, 0);
      addM(g, new THREE.CylinderGeometry(0.02, 0.02, 1.4), makeMat(0xc0c0c0, 0.3, 0.6), 0, 0.72, 0, true);
      addM(g, new THREE.CylinderGeometry(0.06, 0.2, 0.3), makeMat(0xfff5e0, 0.9, 0.0), 0, 1.55, 0, true);
      const lampLight = new THREE.PointLight(0xfff0d0, 0.6, 4);
      lampLight.position.set(0, 1.5, 0);
      g.add(lampLight);
      return g;
    }

    function buildBookshelf() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(1.0, 1.8, 0.3), makeMat(0x654321), 0, 0.9, 0, true);
      for (let i = 0; i < 4; i++) {
        addM(g, new THREE.BoxGeometry(0.92, 0.03, 0.28), makeMat(0x7a5a3a), 0, 0.25 + i * 0.45, 0);
      }
      const bookColors = [0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad];
      for (let shelf = 0; shelf < 3; shelf++) {
        let x = -0.38;
        for (let b = 0; b < 5; b++) {
          const h = 0.2 + Math.random() * 0.15;
          const w = 0.05 + Math.random() * 0.06;
          addM(g, new THREE.BoxGeometry(w, h, 0.18), makeMat(bookColors[(shelf + b) % bookColors.length]), x, 0.27 + shelf * 0.45 + h / 2, 0);
          x += w + 0.02;
        }
      }
      return g;
    }

    function buildRug() {
      const g = new THREE.Group();
      addM(g, new THREE.PlaneGeometry(2.2, 1.6), makeMat(0x8B4513, 0.95, 0.0), 0, 0.01, 0, false, -Math.PI / 2, 0, 0);
      addM(g, new THREE.PlaneGeometry(2.0, 1.4), makeMat(0xCD853F, 0.95, 0.0), 0, 0.015, 0, false, -Math.PI / 2, 0, 0);
      return g;
    }

    function buildPlant() {
      const g = new THREE.Group();
      addM(g, new THREE.CylinderGeometry(0.12, 0.1, 0.22), makeMat(0xa0522d), 0, 0.11, 0, true);
      addM(g, new THREE.CylinderGeometry(0.11, 0.11, 0.03), makeMat(0x3e2723), 0, 0.23, 0);
      const leafMat = makeMat(0x2e7d32);
      addM(g, new THREE.SphereGeometry(0.14, 8, 6), leafMat, 0, 0.4, 0, true);
      addM(g, new THREE.SphereGeometry(0.1, 8, 6), leafMat, 0.08, 0.5, 0.05, true);
      addM(g, new THREE.SphereGeometry(0.1, 8, 6), leafMat, -0.06, 0.48, -0.06, true);
      return g;
    }

    function buildBed() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(1.8, 0.25, 2.2), makeMat(0x5C4033), 0, 0.25, 0, true);
      addM(g, new THREE.BoxGeometry(1.7, 0.2, 2.1), makeMat(0xf5f5f0, 0.9), 0, 0.475, 0, true);
      addM(g, new THREE.BoxGeometry(1.8, 0.8, 0.08), makeMat(0x4a3728), 0, 0.75, -1.05, true);
      [[-0.45, -0.7], [0.45, -0.7]].forEach(([x, z]) => {
        addM(g, new THREE.BoxGeometry(0.5, 0.12, 0.35), makeMat(0xe8e4de, 0.9), x, 0.64, z, true);
      });
      return g;
    }

    function buildTVStand() {
      const g = new THREE.Group();
      addM(g, new THREE.BoxGeometry(1.6, 0.5, 0.4), makeMat(0x2c2c2e, 0.4, 0.2), 0, 0.25, 0, true);
      addM(g, new THREE.BoxGeometry(1.3, 0.75, 0.04), makeMat(0x1a1a1a, 0.2, 0.5), 0, 0.88, 0, true);
      addM(g, new THREE.BoxGeometry(1.2, 0.65, 0.01), makeMat(0x111133, 0.1, 0.0), 0, 0.88, 0.025);
      return g;
    }

    function buildCabinet() {
      const g = new THREE.Group();

    // â”€â”€â”€ Furniture Placement â”€â”€â”€
    function addFurniture(type, itemName, itemPrice) {
      const def = furnitureDefs[type];
      let obj;
      if (!def) {
        obj = new THREE.Group();
        addM(obj, new THREE.BoxGeometry(0.6, 0.6, 0.6), makeMat(0x888888), 0, 0.3, 0, true);
      } else {
        obj = def.build();
      }

      const label = itemName || (def ? def.label : type);
      const price = parseFloat(itemPrice) || 0;
      obj.userData = { type, label, itemName: label, price };

      if (type === 'room' || type === 'shed' || type === 'gazebo') {
        const side = Math.random() > 0.5 ? 1 : -1;
        const axis = Math.random() > 0.5 ? 'x' : 'z';
        if (axis === 'x') obj.position.set(side * (ROOM_W / 2 + 2.5), 0, (Math.random() - 0.5) * ROOM_D);
        else obj.position.set((Math.random() - 0.5) * ROOM_W, 0, side * (ROOM_D / 2 + 2.5));
      } else {
        obj.position.set(randomPos(), 0, randomPos());
      }

      scene.add(obj);
      furnitureObjects.push(obj);
      placedItemsData.push({ type, name: label, price, objId: obj.id });
      selectObject(obj);
      notifyFlutter('added', { type, label, count: furnitureObjects.length, items: getPlacedItemsList() });
    }

    function randomPos() { return (Math.random() - 0.5) * (ROOM_W - 1); }

    function addFurnitureAt(type, x, z, itemName, itemPrice) {
      const def = furnitureDefs[type];
      let obj = def ? def.build() : new THREE.Group();
      if (!def) addM(obj, new THREE.BoxGeometry(0.6, 0.6, 0.6), makeMat(0x888888), 0, 0.3, 0, true);

      const label = itemName || (def ? def.label : type);
      const price = parseFloat(itemPrice) || 0;
      obj.userData = { type, label, itemName: label, price };

      const worldX = (x - 0.5) * ROOM_W * 0.8;
      const worldZ = (z - 0.5) * ROOM_D * 0.8;
      obj.position.set(worldX, 0, worldZ);

      scene.add(obj);
      furnitureObjects.push(obj);
      placedItemsData.push({ type, name: label, price, objId: obj.id });
      selectObject(obj);
    }

    function getPlacedItemsList() { return placedItemsData.map(d => ({ name: d.name, price: d.price, type: d.type })); }

    const highlightMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, emissive: 0xD4AF37, emissiveIntensity: 0.3, roughness: 0.4, metalness: 0.3, transparent: true, opacity: 0.85 });

    function selectObject(obj) {
      deselectCurrent();
      if (!obj) return;
      selectedObject = obj;
      obj.traverse(c => { if (c.isMesh) { c.userData.origMaterial = c.material; c.material = highlightMat; } });
      selectionInfo.textContent = `Selected: ${obj.userData.label || obj.userData.type}`;
      selectionInfo.classList.add('visible');
      notifyFlutter('selected', { type: obj.userData.type, label: obj.userData.label });
    }

    function deselectCurrent() {
      if (!selectedObject) return;
      selectedObject.traverse(c => { if (c.isMesh && c.userData.origMaterial) c.material = c.userData.origMaterial; });
      selectionInfo.classList.remove('visible');
      selectedObject = null;
      notifyFlutter('deselected', {});
    }

    function rotateSelected(angle) { if (selectedObject) selectedObject.rotation.y += angle; }
    function removeSelected() {
      if (selectedObject) {
        const idx = furnitureObjects.indexOf(selectedObject);
        if (idx > -1) furnitureObjects.splice(idx, 1);
        const dIdx = placedItemsData.findIndex(d => d.objId === selectedObject.id);
        if (dIdx > -1) placedItemsData.splice(dIdx, 1);
        scene.remove(selectedObject);
        selectedObject = null;
        selectionInfo.classList.remove('visible');
        notifyFlutter('removed', { count: furnitureObjects.length, items: getPlacedItemsList() });
      }
    }
    function clearAll() {
      furnitureObjects.forEach(obj => scene.remove(obj));
      furnitureObjects.length = 0; placedItemsData.length = 0;
      selectedObject = null; selectionInfo.classList.remove('visible');
      notifyFlutter('cleared', { count: 0, items: [] });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    let isDragging = false, dragOffset = new THREE.Vector3();

    function getPointerPos(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;
    }

    function findFurnitureParent(obj) {
      while (obj) { if (furnitureObjects.includes(obj)) return obj; obj = obj.parent; }
      return null;
    }

    function onPointerDown(e) {
      getPointerPos(e);
      raycaster.setFromCamera(mouse, camera);
      const meshes = [];
      furnitureObjects.forEach(g => g.traverse(c => { if (c.isMesh) meshes.push(c); }));
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length > 0) {
        const p = findFurnitureParent(hits[0].object);
        if (p) {
          selectObject(p); isDragging = true; controls.enabled = false;
          const inter = new THREE.Vector3(); raycaster.ray.intersectPlane(floorPlane, inter);
          dragOffset.copy(p.position).sub(inter);
          e.preventDefault();
        }
      } else deselectCurrent();
    }

    function onPointerMove(e) {
      if (!isDragging || !selectedObject) return;
      getPointerPos(e);
      raycaster.setFromCamera(mouse, camera);
      const inter = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(floorPlane, inter)) {
        const type = selectedObject.userData.type;
        const isStructural = ['room', 'wall', 'fencing', 'glass_wall', 'brick_wall', 'fence', 'stone_wall', 'pergola', 'pathway', 'shed'].includes(type);
        if (isStructural) {
          selectedObject.position.x = inter.x + dragOffset.x;
          selectedObject.position.z = inter.z + dragOffset.z;
        } else {
          selectedObject.position.x = Math.max(-ROOM_W / 2 + 0.5, Math.min(ROOM_W / 2 - 0.5, inter.x + dragOffset.x));
          selectedObject.position.z = Math.max(-ROOM_D / 2 + 0.5, Math.min(ROOM_D / 2 - 0.5, inter.z + dragOffset.z));
        }
      }
      e.preventDefault();
    }

    function onPointerUp() { if (isDragging) { isDragging = false; controls.enabled = true; } }

    function resetCamera() { camera.position.set(0, 14, 11); controls.target.set(0, 0, 0); controls.update(); }
    function fitRoomInView() { camera.position.set(0, 16, 12); controls.target.set(0, 0, 0); controls.update(); }

    function capture3DView() {
      deselectCurrent(); renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      notifyFlutter('capture3d', { image: url }); return url;
    }

    function captureTopView() {
      const sPos = camera.position.clone(), sTarget = controls.target.clone(), sFov = camera.fov;
      deselectCurrent(); camera.position.set(0, 16, 0.001); camera.fov = 35; camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0); controls.update();
      renderer.render(scene, camera); const url = renderer.domElement.toDataURL('image/png');
      camera.position.copy(sPos); camera.fov = sFov; camera.updateProjectionMatrix();
      controls.target.copy(sTarget); controls.update();
      notifyFlutter('captureTopView', { image: url }); return url;
    }

    function getSceneData() {
      const items = furnitureObjects.map(obj => ({
        type: obj.userData.type, label: obj.userData.label, name: obj.userData.itemName,
        price: obj.userData.price, x: Math.round(obj.position.x * 100) / 100,
        z: Math.round(obj.position.z * 100) / 100, rotation: Math.round(obj.rotation.y * 100) / 100,
      }));
      notifyFlutter('sceneData', { items, count: items.length, roomWidth: ROOM_W, roomDepth: ROOM_D });
      return JSON.stringify({ items, roomWidth: ROOM_W, roomDepth: ROOM_D });
    }

    function exportGLB() {
      const exporter = new GLTFExporter(); const group = new THREE.Group();
      scene.traverse(child => {
        if (child.isMesh && !child.name.includes('grid') && !child.name.includes('Helper')) {
          const isStructure = ['floor', 'wall', 'baseboard'].includes(child.name);
          let isFurniture = false, p = child.parent;
          while (p && p !== scene) { if (p.userData && (p.userData.type || p.userData.isFurniture)) { isFurniture = true; break; } p = p.parent; }
          if (isStructure || isFurniture || child.userData.type) group.add(child.clone());
        }
      });
      exporter.parse(group, (result) => {
        const blob = new Blob([result], { type: 'model/gltf-binary' });
        const reader = new FileReader();
        reader.onload = () => { notifyFlutter('exportGLB', { glbBase64: reader.result.split(',')[1] }); };
        reader.readAsDataURL(blob);
      }, (err) => { notifyFlutter('exportGLB', { error: 'Export failed' }); }, { binary: true });
    }

    renderer.domElement.addEventListener('dblclick', (e) => {
      getPointerPos(e); raycaster.setFromCamera(mouse, camera);
      const meshes = []; furnitureObjects.forEach(g => g.traverse(c => { if (c.isMesh) meshes.push(c); }));
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length > 0) {
        const p = findFurnitureParent(hits[0].object);
        if (p) { p.rotation.y += Math.PI / 4; notifyFlutter('rotated', { label: p.userData.label }); }
      }
    });

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointercancel', onPointerUp);
    renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });
    renderer.domElement.addEventListener('touchmove', onPointerMove, { passive: false });
    renderer.domElement.addEventListener('touchend', onPointerUp);

    function notifyFlutter(event, data) {
      try { if (window.FlutterChannel) window.FlutterChannel.postMessage(JSON.stringify({ event, ...data })); } catch (e) { }
    }

    // ─── VR Scene Serialization (Unity-compatible) ───
    function serializeSceneForVR() {
      const items = furnitureObjects.map(obj => ({
        type: obj.userData.type,
        label: obj.userData.label,
        name: obj.userData.itemName,
        price: obj.userData.price || 0,
        // Full transform for Unity (1 unit = 1 meter)
        position: {
          x: Math.round(obj.position.x * 1000) / 1000,
          y: Math.round(obj.position.y * 1000) / 1000,
          z: Math.round(obj.position.z * 1000) / 1000,
        },
        rotation: {
          x: Math.round(obj.rotation.x * 1000) / 1000,
          y: Math.round(obj.rotation.y * 1000) / 1000,
          z: Math.round(obj.rotation.z * 1000) / 1000,
        },
        scale: {
          x: Math.round(obj.scale.x * 1000) / 1000,
          y: Math.round(obj.scale.y * 1000) / 1000,
          z: Math.round(obj.scale.z * 1000) / 1000,
        },
      }));

      const payload = {
        version: '1.0',
        roomWidth: ROOM_W,
        roomDepth: ROOM_D,
        roomHeight: ROOM_H,
        items: items,
        exportedAt: new Date().toISOString(),
      };

      notifyFlutter('vrSceneData', payload);
      return JSON.stringify(payload);
    }

    window.setCameraMode = function(mode) {
      if (mode === 'panorama') {
        camera.position.set(0, 1.5, 0.001);
        controls.target.set(0, 1.5, 0);
        controls.minDistance = 0.1;
        controls.maxDistance = 0.1;
        controls.enablePan = false;
        controls.enableZoom = false;
        // Ensure walls don't cull when inside
        dynamicWalls.forEach(w => w.visible = true);
        controls.update();
      } else {
        const mx = Math.max(ROOM_W, ROOM_D);
        camera.position.set(0, mx * 1.2, mx * 0.9);
        controls.target.set(0, 0.5, 0);
        controls.minDistance = 1.5;
        controls.maxDistance = 18;
        controls.enablePan = true;
        controls.enableZoom = true;
        controls.update();
      }
    };

    window.addFurniture = addFurniture; window.addFurnitureAt = addFurnitureAt;
    window.rotateSelected = rotateSelected; window.removeSelected = removeSelected;
    window.clearAll = clearAll; window.resetCamera = resetCamera;
    window.fitRoomInView = fitRoomInView; window.capture3DView = capture3DView;
    window.captureTopView = captureTopView; window.getSceneData = getSceneData;
    window.serializeSceneForVR = serializeSceneForVR;
    window.showDropZone = (show) => { if (show) document.getElementById('dropIndicator').classList.add('active'); else document.getElementById('dropIndicator').classList.remove('active'); };
    window.exportGLB = exportGLB;

    window.loadScene = function (dataStr) {
      try {
        const data = typeof dataStr === 'string' ? JSON.parse(dataStr) : dataStr;
        clearAll();
        if (data.items && Array.isArray(data.items)) {
          data.items.forEach(item => {
            const def = furnitureDefs[item.type];
            let obj = def ? def.build() : new THREE.Group();
            if (!def) addM(obj, new THREE.BoxGeometry(0.6, 0.6, 0.6), makeMat(0x888888), 0, 0.3, 0, true);
            const lbl = item.name || item.label || (def ? def.label : item.type);
            obj.userData = { type: item.type, label: lbl, itemName: lbl, price: parseFloat(item.price) || 0 };
            obj.position.set(item.x || 0, 0, item.z || 0);
            obj.rotation.y = item.rotation || 0;
            scene.add(obj); furnitureObjects.push(obj);
            placedItemsData.push({ type: item.type, name: lbl, price: obj.userData.price, objId: obj.id });
          });
        }
        notifyFlutter('loaded', { count: furnitureObjects.length, items: getPlacedItemsList() });
      } catch (e) { console.error(e); }
    };

    window.executeFromFlutter = function (jsonStr) {
      try {
        const cmd = JSON.parse(jsonStr);
        switch (cmd.action) {
          case 'add': addFurniture(cmd.type, cmd.name, cmd.price); break;
          case 'addAt': addFurnitureAt(cmd.type, cmd.x, cmd.z, cmd.name, cmd.price); break;
          case 'rotate': rotateSelected(cmd.angle || Math.PI / 6); break;
          case 'remove': removeSelected(); break;
          case 'clear': clearAll(); break;
          case 'resetCamera': resetCamera(); break;
          case 'fitRoom': fitRoomInView(); break;
          case 'capture3d': capture3DView(); break;
          case 'captureTopView': captureTopView(); break;
          case 'getSceneData': getSceneData(); break;
          case 'load': window.loadScene(cmd.data); break;
          case 'setRoomSize': setRoomSize(cmd.width, cmd.length); break;
          case 'exportGLB': exportGLB(); break;
          case 'setCameraMode': window.setCameraMode(cmd.mode); break;
        }
      } catch (e) { }
    };

    function setRoomSize(wFt, lFt) {
      const sc = 0.55; ROOM_W = Math.max(4, (wFt || 12) * sc); ROOM_D = Math.max(4, (lFt || 12) * sc);
      const toRem = []; scene.traverse(c => { if (['floor', 'wall', 'baseboard', 'grid'].includes(c.name)) toRem.push(c); });
      toRem.forEach(o => scene.remove(o)); dynamicWalls.length = 0;
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; fl.name = 'floor'; scene.add(fl);
      const gr = new THREE.GridHelper(Math.max(ROOM_W, ROOM_D), Math.round(Math.max(ROOM_W, ROOM_D) * 2), 0x8c6b4f, 0x9c7b5f); gr.position.y = 0.005; gr.name = 'grid'; scene.add(gr);
      createWall(ROOM_W, ROOM_H, new THREE.Vector3(0, ROOM_H / 2, -ROOM_D / 2), 0);
      createWall(ROOM_W, ROOM_H, new THREE.Vector3(0, ROOM_H / 2, ROOM_D / 2), Math.PI);
      createWall(ROOM_D, ROOM_H, new THREE.Vector3(-ROOM_W / 2, ROOM_H / 2, 0), Math.PI / 2);
      createWall(ROOM_D, ROOM_H, new THREE.Vector3(ROOM_W / 2, ROOM_H / 2, 0), -Math.PI / 2);
      addBaseboard(ROOM_W, new THREE.Vector3(0, 0.05, -ROOM_D / 2 + 0.02), 0);
      addBaseboard(ROOM_W, new THREE.Vector3(0, 0.05, ROOM_D / 2 - 0.02), Math.PI);
      addBaseboard(ROOM_D, new THREE.Vector3(-ROOM_W / 2 + 0.02, 0.05, 0), Math.PI / 2);
      addBaseboard(ROOM_D, new THREE.Vector3(ROOM_W / 2 - 0.02, 0.05, 0), -Math.PI / 2);
      const mx = Math.max(ROOM_W, ROOM_D); camera.position.set(0, mx * 1.2, mx * 0.9); controls.target.set(0, 0.5, 0); controls.update();
      notifyFlutter('roomResized', { width: ROOM_W, depth: ROOM_D });
    }

    function animate() {
      requestAnimationFrame(animate); controls.update();
      const cPos = camera.position;
      dynamicWalls.forEach(w => {
        const toC = new THREE.Vector3().subVectors(cPos, w.position).normalize();
        const dot = w.userData.inwardNormal.dot(toC); w.visible = dot > -0.15;
      });
      renderer.render(scene, camera);
    }
    function onResize() {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize); new ResizeObserver(onResize).observe(container);
    animate(); document.getElementById('loading').classList.add('hidden');
    setTimeout(() => notifyFlutter('ready', { roomWidth: ROOM_W, roomDepth: ROOM_D }), 300);
  </script>
</body>

</html>
