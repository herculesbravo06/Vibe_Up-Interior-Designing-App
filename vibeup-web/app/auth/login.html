<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to VibeUp — AI-powered interior design platform.">
    <title>Login | VibeUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        /* Auth-specific animations */
        .auth-card { animation: cardIn 0.6s var(--ease-out-expo); }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-header { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .role-selector { display: flex; gap: 12px; margin-bottom: 24px; }
        .role-option {
            flex: 1;
            padding: 16px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s var(--ease-smooth);
            background: transparent;
        }
        .role-option:hover { border-color: var(--glass-border-hover); background: rgba(255,255,255,0.02); }
        .role-option.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        .role-option-icon { font-size: 28px; margin-bottom: 8px; }
        .role-option-label { font-size: 13px; font-weight: 600; }
        .role-option-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            user-select: none;
        }
        .password-toggle:hover { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <span style="color: var(--accent)">V</span>ibe<span style="color: var(--text-muted)">Up</span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to continue designing your dream spaces</p>
            </div>

            <div class="auth-card">
                <div class="auth-error" id="auth-error"></div>

                <!-- Role Selector -->
                <div class="role-selector">
                    <div class="role-option active" data-role="user" onclick="selectRole('user')">
                        <div class="role-option-icon">👤</div>
                        <div class="role-option-label">User</div>
                        <div class="role-option-desc">Design my home</div>
                    </div>
                    <div class="role-option" data-role="designer" onclick="selectRole('designer')">
                        <div class="role-option-icon">🎨</div>
                        <div class="role-option-label">Designer</div>
                        <div class="role-option-desc">Professional mode</div>
                    </div>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="form-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            <input type="email" class="form-input" id="email" placeholder="your@email.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="form-input-icon" style="position:relative">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                            <input type="password" class="form-input" id="password" placeholder="••••••••" required autocomplete="current-password">
                            <span class="password-toggle" onclick="togglePassword()">👁</span>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; margin-bottom:20px">
                        <a href="forgot-password.html" class="btn-ghost" style="font-size:13px; color:var(--accent)">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="login-btn">
                        <span id="login-btn-text">Sign In</span>
                        <div class="spinner" id="login-spinner" style="display:none; width:18px; height:18px; border-width:2px"></div>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="../app.js?v=1.1"></script>
    <script>
        let selectedRole = 'user';

        // If already logged in, redirect
        if (Auth.isLoggedIn()) {
            const user = Auth.getUser();
            if (user.role === 'designer') {
                navigateTo('app/designer/dashboard.html');
            } else {
                navigateTo('app/dashboard/index.html');
            }
        }

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.toggle('active', el.dataset.role === role);
            });
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
            } else {
                input.type = 'password';
                toggle.textContent = '👁';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('auth-error');
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('login-btn-text');
            const spinner = document.getElementById('login-spinner');

            errorEl.classList.remove('visible');
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.style.display = 'block';

            try {
                const result = await Api.login(email, password, selectedRole);

                if (result.status === 'success') {
                    const userData = result.data || {};
                    
                    // Security: Use the role returned by server, not the manual selector
                    if (userData.role !== selectedRole) {
                        errorEl.textContent = `Access denied: This account is registered as a ${userData.role}.`;
                        errorEl.classList.add('visible');
                        btn.disabled = false;
                        btnText.textContent = 'Sign In';
                        spinner.style.display = 'none';
                        return;
                    }

                    Auth.saveUser(userData);

                    // Redirect based on server-verified role
                    if (userData.role === 'designer') {
                        navigateTo('app/designer/dashboard.html');
                    } else {
                        navigateTo('app/dashboard/index.html');
                    }
                } else {
                    errorEl.textContent = result.message || 'Invalid credentials. Please try again.';
                    errorEl.classList.add('visible');
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Please check your network.';
                errorEl.classList.add('visible');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
