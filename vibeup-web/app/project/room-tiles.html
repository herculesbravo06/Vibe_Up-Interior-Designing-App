<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Layout | VibeUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s var(--ease-smooth);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .room-card:hover {
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .room-card.done {
            border-color: var(--success);
            background: linear-gradient(135deg, rgba(76,175,80,0.05), transparent);
        }

        .room-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: transform 0.3s;
        }
        .room-card:hover .room-icon-box { transform: scale(1.1); }

        .room-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .room-info p {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .done-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .masterpiece-panel {
            position: fixed;
            bottom: 0;
            left: 280px; /* Sidebar width */
            right: 0;
            padding: 32px 40px;
            background: linear-gradient(to top, var(--bg-primary) 80%, transparent);
            display: flex;
            justify-content: center;
            z-index: 100;
        }
        @media (max-width: 1024px) { .masterpiece-panel { left: 0; } }

        .btn-masterpiece {
            width: 100%;
            max-width: 600px;
            height: 64px;
            font-size: 16px;
            letter-spacing: 0.1em;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(201,168,76,0.2);
        }
        .btn-masterpiece:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .fade-up { opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s var(--ease-out-expo) forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
            <header style="margin-bottom: 40px;">
                <h1 class="fade-up" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 8px;">Artisan Blueprint</h1>
                <p class="fade-up" style="color: var(--text-secondary); max-width: 600px; line-height: 1.6;">
                    We've synthesized several distinct spaces for your BHK layout. Select a room to begin the bespoke design journey.
                </p>
            </header>

            <div id="house-viewport" style="width: 100%; height: 500px; background: var(--bg-secondary); border-radius: 32px; border: 1px solid var(--glass-border); position: relative; overflow: hidden; margin-top: 32px;" class="fade-up">
                <div style="position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 12px; font-size: 12px; color: var(--text-secondary); backdrop-filter: blur(10px);">
                    🖱️ LEFT: Orbit | RIGHT: Pan | CLICK ROOM: Design
                </div>
            </div>

            <div class="room-grid" id="room-tiles-grid" style="display:none">
                <!-- Fallback grid hidden but kept for logic -->
            </div>

            <div style="height: 150px;"></div> <!-- Spacer -->

            <div class="masterpiece-panel">
                <button class="btn btn-primary btn-masterpiece" id="btn-masterpiece" onclick="finalizeFullHouse()">
                    🏛️ MASTERPIECE VIEW
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../app.js"></script>
    <script>
        if (!Auth.requireAuth()) {}
        const user = Auth.getUser();
        renderSidebar('new-project', user.role);

        // ─── Data & Config ───
        const rawRooms = sessionStorage.getItem('vibeup_house_rooms');
        const bhk = sessionStorage.getItem('vibeup_bhk');
        
        if (!rawRooms) {
            showToast('No project data found. Starting over.', 'error');
            setTimeout(() => navigateTo('app/project/dashboard/index.html'), 1500);
        }

        const rooms = JSON.parse(rawRooms);
        const designedStates = JSON.parse(localStorage.getItem(`designed_rooms_${bhk}`) || '{}');

        const typeColors = {
            'living': 0x4CAF50, 'kitchen': 0xFF7043, 'bedroom': 0x7B68EE,
            'bathroom': 0x29B6F6, 'dining': 0xFFCA28, 'office': 0x78909C,
            'hallway': 0xAB47BC, 'balcony': 0x26A69A
        };

        // ─── 3D FLOORPLAN ENGINE ───
        let scene, camera, renderer, raycaster, mouse;
        const roomMeshes = [];
        const SCALE = 0.5; // Scale for the mini-map house

        function init3D() {
            const container = document.getElementById('house-viewport');
            const w = container.clientWidth;
            const h = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0c);

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(25, 25, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // High-quality ambient and directional lighting
            scene.add(new THREE.AmbientLight(0x404040, 1.2));
            const spotlight = new THREE.SpotLight(0xffffff, 0.8);
            spotlight.position.set(10, 30, 10);
            spotlight.castShadow = true;
            scene.add(spotlight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Architectural Material Palette
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.7 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, side: THREE.FrontSide });

            let currentX = 0, currentZ = 0;
            let rowMaxZ = 0;
            let col = 0;
            const maxCols = Math.ceil(Math.sqrt(rooms.length));

            rooms.forEach((room, i) => {
                const rw = room.width * SCALE;
                const rl = room.length * SCALE;
                const rh = room.height * SCALE * 0.4;

                if (col >= maxCols) {
                    currentX = 0;
                    currentZ += rowMaxZ;
                    rowMaxZ = 0;
                    col = 0;
                }

                // Save coordinate data so Workspace can rebuild exactly this joined arrangement
                room.placement = { x: currentX, z: currentZ };

                const roomGroup = new THREE.Group();
                roomGroup.position.set(currentX + rw / 2, 0, currentZ + rl / 2);

                // Floor Slab
                const floorGeo = new THREE.PlaneGeometry(rw, rl);
                const floor = new THREE.Mesh(floorGeo, woodMat.clone());
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                roomGroup.add(floor);

                // Walls (4 sides, open top)
                const wallData = [
                    { w: rw, h: rh, pos: [0, rh/2, -rl/2], rot: [0, 0, 0] },
                    { w: rw, h: rh, pos: [0, rh/2, rl/2], rot: [0, Math.PI, 0] },
                    { w: rl, h: rh, pos: [-rw/2, rh/2, 0], rot: [0, Math.PI/2, 0] },
                    { w: rl, h: rh, pos: [rw/2, rh/2, 0], rot: [0, -Math.PI/2, 0] }
                ];
                wallData.forEach(wd => {
                    const geo = new THREE.PlaneGeometry(wd.w, wd.h);
                    const mesh = new THREE.Mesh(geo, wallMat.clone());
                    mesh.position.set(...wd.pos);
                    mesh.rotation.set(...wd.rot);
                    mesh.receiveShadow = true;
                    roomGroup.add(mesh);
                });

                roomGroup.userData = { index: i, name: room.name };
                scene.add(roomGroup);
                roomMeshes.push(roomGroup);

                currentX += rw; // Adjacency without gap
                if (rl > rowMaxZ) rowMaxZ = rl;
                col++;
            });
            
            // Persist the placement coordinates
            sessionStorage.setItem('vibeup_house_rooms', JSON.stringify(rooms));

            // Center Scene Camera
            const boundBox = new THREE.Box3().setFromObject(scene);
            const center = boundBox.getCenter(new THREE.Vector3());
            camera.lookAt(center);
            
            animate();
            container.addEventListener('click', onSceneClick);
        }

        function onSceneClick(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj.parent && obj.parent !== scene) obj = obj.parent;
                if (obj.userData && obj.userData.index !== undefined) {
                    designRoom(obj.userData.index);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Gentle rotation
            scene.rotation.y += 0.001;
            renderer.render(scene, camera);
        }

        function designRoom(idx) {
            const room = rooms[idx];
            sessionStorage.setItem('vibeup_current_room_idx', idx);
            let url = `app/project/workspace.html?type=room&name=${encodeURIComponent(room.name)}&w=${room.width}&l=${room.length}&h=${room.height}&isHousePart=true`;
            if (room.furniture && room.furniture.length > 0) {
                url += `&auto_furnish=${encodeURIComponent(JSON.stringify(room.furniture))}`;
            }
            navigateTo(url);
        }

        function finalizeFullHouse() {
            navigateTo(`app/project/workspace.html?type=masterpiece`);
        }

        // Init
        setTimeout(init3D, 100);
    </script>
</body>
</html>
