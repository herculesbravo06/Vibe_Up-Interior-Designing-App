<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | VibeUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        .chat-layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 64px); gap: 0; }

        /* ─── Conversation List ─── */
        .conv-list {
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            overflow-y: auto;
        }
        .conv-search {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
        }
        .conv-search input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px;
            color: var(--text-primary); outline: none;
        }
        .conv-search input:focus { border-color: var(--accent); }

        .conv-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; cursor: pointer; transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .conv-item:hover { background: rgba(255,255,255,0.03); }
        .conv-item.active { background: var(--accent-glow); border-left: 2px solid var(--accent); }

        .conv-avatar {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: #0a0a0a;
        }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .conv-time { font-size: 11px; color: var(--text-dim); }
        .conv-unread { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); font-size: 10px; display: flex; align-items: center; justify-content: center; color: #0a0a0a; font-weight: 700; }

        /* ─── Chat Room ─── */
        .chat-room { display: flex; flex-direction: column; height: 100%; }

        .chat-header {
            padding: 16px 20px; border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 12px;
        }
        .chat-header-name { font-size: 15px; font-weight: 600; }
        .chat-header-status { font-size: 11px; color: var(--text-muted); }
        .chat-header .dot-online { width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin-left: auto; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg.sent {
            align-self: flex-end;
            background: var(--accent);
            color: #0a0a0a;
            border-bottom-right-radius: 4px;
        }
        .msg.received {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }
        .msg-time { font-size: 10px; margin-top: 4px; opacity: 0.7; }

        .chat-input-bar {
            padding: 16px 20px; border-top: 1px solid var(--glass-border);
            display: flex; gap: 10px; align-items: flex-end;
        }
        .chat-input-bar textarea {
            flex: 1; background: var(--bg-input); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); padding: 12px 14px; font-size: 14px;
            color: var(--text-primary); outline: none; resize: none; max-height: 100px; min-height: 42px;
            font-family: inherit;
        }
        .chat-input-bar textarea:focus { border-color: var(--accent); }
        .chat-send-btn {
            width: 42px; height: 42px; border-radius: var(--radius-md);
            background: var(--accent); display: flex; align-items: center;
            justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
        }
        .chat-send-btn:hover { background: var(--accent-light); transform: scale(1.05); }

        .chat-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 15px; flex-direction: column; gap: 8px;
        }
        .chat-empty-icon { font-size: 48px; opacity: 0.3; }

        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; }
            .conv-list { display: none; }
            .conv-list.mobile-visible { display: flex; position: fixed; inset: 0; z-index: 200; background: var(--bg-primary); }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="main-content" style="padding:0; max-width:none">
            <div class="chat-layout">
                <!-- Conversation List -->
                <div class="conv-list" id="conv-list">
                    <div class="conv-search">
                        <input type="text" placeholder="Search conversations..." oninput="filterConversations(this.value)">
                    </div>
                    <div id="conv-items">
                        <div style="text-align:center; padding:40px; color:var(--text-muted)">
                            <div class="spinner" style="margin:0 auto 12px"></div>
                            Loading conversations...
                        </div>
                    </div>
                </div>

                <!-- Chat Room -->
                <div class="chat-room" id="chat-room">
                    <div class="chat-empty">
                        <div class="chat-empty-icon">💬</div>
                        <div>Select a conversation to start messaging</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        if (!Auth.requireAuth()) {}
        const user = Auth.getUser();
        renderSidebar('chat', user.role === 'designer' ? 'designer' : 'user');

        let conversations = [];
        let currentChatId = null;
        let pollTimer = null;

        async function loadConversations() {
            try {
                const result = await Api.getChats(user.id);
                if (result.status === 'success' && Array.isArray(result.data)) {
                    conversations = result.data;
                    renderConversations();
                }
            } catch (e) {
                console.error("Error loading conversations:", e);
            }
        }

        function renderConversations() {
            const container = document.getElementById('conv-items');
            if (conversations.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted)">
                        <div style="font-size:32px; margin-bottom:8px; opacity:0.3">💬</div>
                        <div>No conversations yet</div>
                        <div style="font-size:12px; margin-top:4px">Start by hiring a designer</div>
                    </div>`;
                return;
            }

            container.innerHTML = conversations.map(c => {
                const initials = (c.recipient_name || 'U').charAt(0).toUpperCase();
                return `
                    <div class="conv-item ${currentChatId === c.id ? 'active' : ''}" onclick="openChat('${c.id}', '${escapeHtml(c.recipient_name || 'User')}')">
                        <div class="conv-avatar">${initials}</div>
                        <div class="conv-info">
                            <div class="conv-name">${escapeHtml(c.recipient_name || 'User')}</div>
                            <div class="conv-last">${escapeHtml(c.last_message || 'No messages')}</div>
                        </div>
                        <div class="conv-meta">
                            <div class="conv-time">${c.last_time ? timeAgo(c.last_time) : ''}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterConversations(query) {
            const q = query.toLowerCase();
            document.querySelectorAll('.conv-item').forEach(el => {
                const name = el.querySelector('.conv-name')?.textContent?.toLowerCase() || '';
                el.style.display = name.includes(q) ? '' : 'none';
            });
        }

        async function openChat(chatId, name) {
            currentChatId = chatId;
            renderConversations(); // Update active state

            const room = document.getElementById('chat-room');
            room.innerHTML = `
                <div class="chat-header">
                    <div class="conv-avatar" style="width:36px;height:36px;font-size:14px">${name.charAt(0)}</div>
                    <div>
                        <div class="chat-header-name">${escapeHtml(name)}</div>
                        <div class="chat-header-status">Online</div>
                    </div>
                    <div class="dot-online"></div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div style="text-align:center; padding:20px; color:var(--text-muted)">
                        <div class="spinner" style="margin:0 auto 8px; width:24px; height:24px"></div>
                        Loading messages...
                    </div>
                </div>
                <div class="chat-input-bar">
                    <textarea id="msg-input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                    <div class="chat-send-btn" onclick="sendMessage()">▶</div>
                </div>
            `;

            loadMessages(chatId);
            // Start polling
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => loadMessages(chatId), 3000);
        }

        async function loadMessages(chatId) {
            try {
                const result = await Api.getMessages(chatId);
                const messages = result.status === 'success' ? result.data : [];
                renderMessages(messages);
            } catch (e) {
                console.error("Error loading messages:", e);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages');
            if (!container) return;

            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted)">No messages yet. Say hello!</div>';
                return;
            }

            container.innerHTML = messages.map(m => {
                const isSent = m.sender_id === user.id;
                return `
                    <div class="msg ${isSent ? 'sent' : 'received'}">
                        ${escapeHtml(m.message_text || '')}
                        <div class="msg-time">${timeAgo(m.timestamp)}</div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            input.value = '';

            // Optimistic UI update
            const container = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = 'msg sent';
            msg.innerHTML = `${escapeHtml(text)}<div class="msg-time">Just now</div>`;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;

            // Send to API
            await Api.sendMessage({
                chat_id: currentChatId,
                sender_id: user.id,
                message_text: text,
            });
            
            // Refresh conversations to update last message
            loadConversations();
        }

        loadConversations();
        setInterval(loadConversations, 10000);
    </script>
</body>
</html>
