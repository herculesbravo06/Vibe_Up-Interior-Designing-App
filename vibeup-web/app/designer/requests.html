<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Requests | VibeUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../app.css">
    <style>
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .filter-tab {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            transition: all 0.3s;
            background: transparent;
        }
        .filter-tab:hover { border-color: var(--glass-border-hover); }
        .filter-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .request-card:hover { border-color: var(--glass-border-hover); }

        .request-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .request-avatar {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark)); font-weight: 700; font-size: 16px; color: #0a0a0a;
        }
        .request-info { flex: 1; }
        .request-name { font-weight: 600; font-size: 15px; }
        .request-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .request-body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }

        .request-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .request-meta-item {
            font-size: 12px; padding: 5px 12px; border-radius: 20px;
            background: rgba(255,255,255,0.04); color: var(--text-secondary);
        }

        .request-actions { display: flex; gap: 10px; }

        .fade-up { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s var(--ease-out-expo) forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
            <a class="page-back" onclick="history.back()" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); cursor:pointer; margin-bottom:24px">← Back</a>

            <div class="topbar fade-up">
                <div class="topbar-left">
                    <h1>Manage Requests</h1>
                    <p>Review and respond to design requests from clients</p>
                </div>
            </div>

            <div class="filter-tabs fade-up">
                <div class="filter-tab active" data-status="all" onclick="filterRequests('all')">All</div>
                <div class="filter-tab" data-status="pending" onclick="filterRequests('pending')">Pending</div>
                <div class="filter-tab" data-status="accepted" onclick="filterRequests('accepted')">Accepted</div>
                <div class="filter-tab" data-status="declined" onclick="filterRequests('declined')">Declined</div>
            </div>

            <div id="requests-container">
                <div style="text-align:center; padding:40px; color:var(--text-muted)">
                    <div class="spinner" style="margin:0 auto 12px"></div>
                    Loading requests...
                </div>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        if (!Auth.requireAuth()) {}
        const user = Auth.getUser();
        renderSidebar('requests', 'designer');

        const designerId = user.designerId || user.id;
        let allRequests = [];
        let currentFilter = 'all';

        async function loadRequests() {
            const container = document.getElementById('requests-container');
            const result = await Api.getDesignRequests({ designer_id: designerId });
            
            if (result.status === 'success' && Array.isArray(result.data)) {
                allRequests = result.data;
            } else if (Array.isArray(result)) {
                allRequests = result;
            } else {
                allRequests = [];
            }

            renderRequests();
        }

        function filterRequests(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.status === status);
            });
            renderRequests();
        }

        function renderRequests() {
            const container = document.getElementById('requests-container');
            let filtered = allRequests;
            if (currentFilter !== 'all') {
                filtered = allRequests.filter(r => r.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📥</div>
                        <div class="empty-state-title">No ${currentFilter === 'all' ? '' : currentFilter} requests</div>
                        <div class="empty-state-text">New design requests from clients will appear here.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(req => {
                const statusBadge = {
                    pending: '<span class="badge badge-warning">Pending</span>',
                    accepted: '<span class="badge badge-success">Accepted</span>',
                    declined: '<span class="badge badge-error">Declined</span>',
                };
                const initials = (req.user_name || 'U').charAt(0).toUpperCase();

                return `
                    <div class="request-card fade-up">
                        <div class="request-header">
                            <div class="request-avatar">${initials}</div>
                            <div class="request-info">
                                <div class="request-name">${escapeHtml(req.user_name || 'Client')}</div>
                                <div class="request-time">${timeAgo(req.created_at)}</div>
                            </div>
                            ${statusBadge[req.status] || ''}
                        </div>
                        <div class="request-body">${escapeHtml(req.description || req.project_name || 'Design request')}</div>
                        <div class="request-meta">
                            ${req.room_type ? `<span class="request-meta-item">🏠 ${escapeHtml(req.room_type)}</span>` : ''}
                            ${req.budget ? `<span class="request-meta-item">💰 ₹${escapeHtml(req.budget)}</span>` : ''}
                            ${req.style ? `<span class="request-meta-item">🎨 ${escapeHtml(req.style)}</span>` : ''}
                        </div>
                        ${req.status === 'pending' ? `
                            <div class="request-actions">
                                <button class="btn btn-primary btn-sm" onclick="updateRequest('${req.id}', 'accepted')">
                                    ✓ Accept
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="updateRequest('${req.id}', 'declined')">
                                    ✕ Decline
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function updateRequest(requestId, newStatus) {
            showToast(`${newStatus === 'accepted' ? 'Accepting' : 'Declining'} request...`, 'info');
            const result = await Api.updateRequestStatus(requestId, newStatus, designerId);
            if (result.status === 'success') {
                showToast(`Request ${newStatus}!`, 'success');
                loadRequests();
            } else {
                showToast(result.message || 'Failed to update', 'error');
            }
        }

        loadRequests();
        setInterval(loadRequests, 10000);
    </script>
</body>
</html>
